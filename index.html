<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR Альбом</title>
  <link rel="icon" href="./fav.png">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    .a-enter-vr, .a-enter-ar { display: none !important; }

    #loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px;
      background: #111; color: #fff; font-family: sans-serif;
    }
    #loading.hidden { display: none; }

    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #333;
      border-top-color: #4fc3f7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #hint {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      padding: 10px 18px; border-radius: 999px;
      background: rgba(0,0,0,0.6); color: #fff;
      font-family: sans-serif; font-size: 14px;
      pointer-events: none; transition: opacity 0.4s;
      z-index: 100;
    }
    #hint.hidden { opacity: 0; }

    #error {
      position: fixed; inset: 0; z-index: 10000;
      display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px; padding: 24px;
      background: #111; color: #fff; font-family: sans-serif;
      text-align: center;
    }
    #error.visible { display: flex; }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text">Загрузка AR…</div>
  </div>

  <div id="hint" class="hidden">
    Наведите камеру на портрет или фотографию
  </div>

  <div id="error">
    <h2>Не удалось запустить камеру</h2>
    <p id="error-text"></p>
    <p style="opacity:0.7;font-size:14px">
      Проверьте, что сайт открыт по HTTPS и вы разрешили доступ к камере.
    </p>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; uiLoading: no; uiError: no; uiScanning: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights; antialias: true; alpha: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
    style="width:100%;height:100%;">

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false;"></a-camera>
  </a-scene>

  <script>
    // ---------------------------------------------------------------
    // 1. Определяем, сколько учеников: пробуем загрузить видео по порядку
    //    Пока файл существует — считаем, что ученик есть.
    //    Как только 404 — останавливаемся.
    // ---------------------------------------------------------------
    async function detectStudentCount(maxCheck = 200) {
      let count = 0;
      for (let i = 1; i <= maxCheck; i++) {
        const url = `./videos/video-C-${String(i).padStart(2, '0')}.mp4`;
        const exists = await fileExists(url);
        if (!exists) break;
        count = i;
      }
      return count;
    }

    function fileExists(url) {
      return new Promise((resolve) => {
        const xhr = new XMLHttpRequest();
        xhr.open('HEAD', url, true);
        xhr.onreadystatechange = () => {
          if (xhr.readyState === 4) {
            resolve(xhr.status >= 200 && xhr.status < 400);
          }
        };
        xhr.onerror = () => resolve(false);
        xhr.send();
      });
    }

    // ---------------------------------------------------------------
    // 2. Основная инициализация
    // ---------------------------------------------------------------
    (async function init() {
      const loadingText = document.getElementById('loading-text');
      loadingText.textContent = 'Ищем видео…';

      const totalStudents = await detectStudentCount();
      console.log('Найдено учеников:', totalStudents);

      if (totalStudents === 0) {
        loadingText.textContent = 'Видео не найдены. Проверьте папку videos/.';
        return;
      }

      // Карта: targetIndex -> src
      const targetToVideo = {};
      targetToVideo[0] = './videos/video-A.mp4';
      targetToVideo[1] = './videos/video-B.mp4';
      for (let i = 1; i <= totalStudents; i++) {
        targetToVideo[i + 1] = `./videos/video-C-${String(i).padStart(2, '0')}.mp4`;
      }

      const TOTAL_TARGETS = 2 + totalStudents;

      const scene = document.querySelector('a-scene');

      // Создаём <a-entity> для каждой цели
      for (let idx = 0; idx < TOTAL_TARGETS; idx++) {
        const entity = document.createElement('a-entity');
        entity.setAttribute('mindar-image-target', `targetIndex: ${idx}`);
        entity.setAttribute('data-index', String(idx));
        entity.setAttribute('visible', 'false');

        const video = document.createElement('a-video');
        video.setAttribute('width', '1');
        video.setAttribute('height', '1');
        video.setAttribute('position', '0 0 0');
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        video.setAttribute('crossorigin', 'anonymous');

        entity.appendChild(video);
        scene.appendChild(entity);
      }

      // Обработчики
      scene.addEventListener('targetFound', (e) => {
        const idx = e.detail.targetIndex;
        const src = targetToVideo[idx];
        if (!src) return;

        const entity = document.querySelector(`[data-index="${idx}"]`);
        if (!entity) return;

        const videoEl = entity.querySelector('a-video');
        videoEl.setAttribute('src', src);

        const tryPlay = () => {
          const mesh = videoEl.getObject3D('mesh');
          const video = mesh && mesh.material && mesh.material.map && mesh.material.map.image;
          if (video && typeof video.play === 'function') {
            video.currentTime = 0;
            video.loop = true;
            video.muted = false;
            video.play().catch(() => {
              video.muted = true;
              video.play().catch(() => {});
            });
          }
        };
        setTimeout(tryPlay, 100);

        entity.setAttribute('visible', 'true');
        document.getElementById('hint').classList.add('hidden');
      });

      scene.addEventListener('targetLost', (e) => {
        const idx = e.detail.targetIndex;
        const entity = document.querySelector(`[data-index="${idx}"]`);
        if (!entity) return;

        const videoEl = entity.querySelector('a-video');
        const mesh = videoEl.getObject3D('mesh');
        const video = mesh && mesh.material && mesh.material.map && mesh.material.map.image;
        if (video && typeof video.pause === 'function') video.pause();

        entity.setAttribute('visible', 'false');
        document.getElementById('hint').classList.remove('hidden');
      });

      scene.addEventListener('loaded', () => {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('hint').classList.remove('hidden');
      });

      // Ошибки камеры
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: true })
          .then((stream) => stream.getTracks().forEach((t) => t.stop()))
          .catch((err) => {
            document.getElementById('error-text').textContent = err.message || String(err);
            document.getElementById('error').classList.add('visible');
          });
      } else {
        document.getElementById('error-text').textContent = 'Браузер не поддерживает камеру';
        document.getElementById('error').classList.add('visible');
      }
    })();
  </script>

</body>
</html>
