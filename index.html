<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <link rel="icon" href="public/fav.png">
  <title>Живой фотоальбом</title>
</head>
<body>
  <a-scene mindar-image="imageTargetSrc: public/targets.mind; uiScanning: no" color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

        <a-assets>
      <!-- Три видео: id должны быть уникальными -->
      <video id="vid0" src=" public/video1.mp4" autoplay loop muted playsinline webkit-playsinline></video>
      <video id="vid1" src=" public/video2.mp4" autoplay loop muted playsinline webkit-playsinline></video>
      <video id="vid2" src=" public/video3.mp4" autoplay loop muted playsinline webkit-playsinline></video>
    </a-assets>
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

       <!-- ЦЕЛЬ 0: Первое фото (первое в компиляторе) -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-plane src="#vid0" position="0 0 0" height="1.333" width="1" rotation="0 0 0"></a-plane>
    </a-entity>

    <!-- ЦЕЛЬ 1: Второе фото -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-plane src="#vid1" position="0 0 0" height="1.5" width="1" rotation="0 0 0"></a-plane>
    </a-entity>

    <!-- ЦЕЛЬ 2: Третье фото -->
    <a-entity mindar-image-target="targetIndex: 2">
      <a-plane src="#vid2" position="0 0 0" height="0.5625" width="1" rotation="0 0 0"></a-plane>
    </a-entity>

  </a-scene>

  <script>
    // Флаг: false = звук выключен, true = включён
  let soundOn = false;

  window.addEventListener("click", () => {
    // Переключаем флаг
    soundOn = !soundOn;

    document.querySelectorAll('video').forEach(video => {
      video.muted = !soundOn;

      // На всякий случай перезапускаем воспроизведение
      video.play().catch(error => {
        console.log("Video play error:", error);
      });
    });

    // Показать пользователю текущее состояние
    showSoundStatus(soundOn);
  });

  // Небольшой индикатор в углу экрана
  function showSoundStatus(isOn) {
    let indicator = document.getElementById("sound-indicator");
    if (!indicator) {
      indicator = document.createElement("div");
      indicator.id = "sound-indicator";
      indicator.style.cssText = `
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 10px 20px;
        border-radius: 20px;
        font-family: sans-serif;
        font-size: 16px;
        z-index: 9999;
        transition: opacity 0.3s;
        pointer-events: none;
      `;
      document.body.appendChild(indicator);
    }

    indicator.textContent = isOn ? "🔊 Звук включён" : "🔇 Звук выключен";
    indicator.style.opacity = "1";

    // Скрываем через 1.5 секунды
    clearTimeout(window._soundTimer);
    window._soundTimer = setTimeout(() => {
      indicator.style.opacity = "0";
    }, 1500);
   }
  </script>
</body>
</html>
